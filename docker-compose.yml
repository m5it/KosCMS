
version: '3.8'

services:
  webcms:
    build: .
    container_name: webcms
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=kosdb://kosdb:5556/webcms
      - KOSDB_HOST=kosdb
      - KOSDB_PORT=5556
      - KOSDB_USER=admin
      - KOSDB_PASSWORD=${KOSDB_PASSWORD:-admin}
      - KOSDB_DATABASE=webcms
      - CACHE_TYPE=redis
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me-in-production}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - kosdb
      - redis
    networks:
      - webcms-network

  kosdb:
    image: m5it/kosdb:latest
    container_name: webcms-kosdb
    restart: unless-stopped
    ports:
      - "5556:5556"
    volumes:
      - kosdb-data:/data
    networks:
      - webcms-network

  redis:
    image: redis:7-alpine
    container_name: webcms-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - webcms-network

  nginx:
    image: nginx:alpine
    container_name: webcms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - webcms
    networks:
      - webcms-network

volumes:
  kosdb-data:
  redis-data:

networks:
  webcms-network:
    driver: bridge

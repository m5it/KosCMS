
version: '3.8'

services:
  webcms:
    build: .
    container_name: webcms
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///data/webcms.db
      - CACHE_TYPE=redis
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me-in-production}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - webcms-network

  redis:
    image: redis:7-alpine
    container_name: webcms-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - webcms-network

  nginx:
    image: nginx:alpine
    container_name: webcms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - webcms
    networks:
      - webcms-network

volumes:
  redis-data:

networks:
  webcms-network:
    driver: bridge

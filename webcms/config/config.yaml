app:
  name: WebCMS
  version: "1.0.0"
  debug: false
  secret_key: "your-secret-key-change-in-production"
  timezone: "UTC"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  ssl_cert: null
  ssl_key: null

# Database configuration
# Supports: sqlite, postgresql, mysql, kosdb
database:
  # Connection URL format:
  # sqlite:///path/to/db.sqlite
  # postgresql://user:pass@host:port/db
  # mysql://user:pass@host:port/db
  # kosdb://user:pass@host:port/db
  
  url: "kosdb://admin:admin@localhost:9999/webcms"
  
  # For KosDB-specific settings
  kosdb:
    host: "localhost"
    port: 9999
    username: "admin"
    password: "admin"
    database: "webcms"
    pool_size: 10
    replication:
      enabled: false
      role: "standalone"  # standalone, master, slave, master_master
      server_id: 1
      master_host: null
      master_port: null
      peer_host: null
      peer_port: null
  
  # Legacy SQLAlchemy settings (for non-KosDB)
  pool_size: 10
  max_overflow: 20
  echo: false

cache:
  backend: "memory"  # memory, redis
  redis_url: "redis://localhost:6379/0"
  default_timeout: 300

security:
  csrf_enabled: true
  session_timeout: 3600
  password_min_length: 8
  bcrypt_rounds: 12
  rate_limit:
    requests: 100
    window: 60

uploads:
  max_size: 10485760  # 10MB
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".doc"
    - ".docx"
  storage: "local"
  local_path: "media"

plugins:
  enabled: []
  disabled: []

themes:
  active: "default"
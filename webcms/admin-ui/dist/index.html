<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCMS Admin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f7fa; color:#1f2937; }
    .admin-shell { display:flex; min-height:100vh; }
    .admin-sidebar { width:260px; background:#111827; color:#fff; padding:1.5rem; flex-shrink:0; }
    .admin-brand { margin-bottom:2rem; }
    .admin-brand h2 { font-size:1.5rem; }
    .admin-brand small { color:#9ca3af; }
    .nav-group { margin-bottom:1.5rem; }
    .nav-group h4 { color:#6b7280; text-transform:uppercase; font-size:.75rem; margin-bottom:.5rem; }
    .nav-group ul { list-style:none; }
    .nav-group li { margin-bottom:.25rem; }
    .nav-group a { color:#d1d5db; text-decoration:none; display:flex; align-items:center; gap:.5rem; padding:.5rem; border-radius:6px; }
    .nav-group a:hover, .nav-group a.active { background:#1f2937; color:#fff; }
    .admin-main { flex:1; display:flex; flex-direction:column; min-width:0; }
    .admin-topbar { background:#fff; padding:1rem 1.5rem; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; }
    .admin-content { padding:1.5rem; overflow-y:auto; }
    .admin-page h1 { margin-bottom:1rem; }
    .btn { background:#2563eb; color:#fff; border:none; padding:.5rem 1rem; border-radius:6px; cursor:pointer; margin-right:.5rem; margin-bottom:.5rem; }
    .btn-secondary { background:#6b7280; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .toolbar, .form-actions { margin-bottom:1rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    .card { background:#fff; padding:1rem; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .data-table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    .data-table th, .data-table td { padding:.75rem; text-align:left; border-bottom:1px solid #e5e7eb; }
    .data-table th { background:#f3f4f6; font-weight:600; }
    .data-table tr:hover { background:#f9fafb; }
    .form-grid { display:grid; grid-template-columns:140px 1fr; gap:.75rem; align-items:center; margin-bottom:1rem; }
    .form-grid input, .form-grid select, .form-grid textarea { padding:.5rem; border:1px solid #d1d5db; border-radius:4px; width:100%; }
    .settings-group { background:#fff; padding:1rem; border-radius:8px; margin-bottom:1rem; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    .settings-group h3 { margin-bottom:.75rem; }
    .media-grid, .theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:1rem; }
    .media-card, .theme-card { background:#fff; padding:1rem; border-radius:6px; border:2px solid transparent; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    .media-card.selected, .theme-card.active { border-color:#2563eb; }
    .plugin-row, .workflow-row { display:flex; justify-content:space-between; align-items:center; padding:.75rem; background:#fff; border-bottom:1px solid #e5e7eb; gap:.5rem; flex-wrap:wrap; }
    .permission-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:.5rem; }
    .permission-item { display:flex; align-items:center; gap:.5rem; padding:.5rem; border:1px solid #e5e7eb; border-radius:4px; }
    .alert { padding:.75rem; background:#dbeafe; color:#1e40af; border-radius:6px; margin-bottom:1rem; }
    .status-badge { display:inline-block; padding:.25rem .5rem; border-radius:999px; background:#2563eb; color:#fff; font-size:.75rem; }
    .error-box { background:#fee2e2; color:#991b1b; padding:1rem; border-radius:6px; margin:1rem 0; }
    pre { white-space:pre-wrap; word-break:break-word; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <h2>WebCMS</h2>
        <small>Admin Control Panel</small>
      </div>
      <nav id="sidebar-nav"></nav>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <nav id="breadcrumb"></nav>
        <div><span>Admin User</span></div>
      </header>
      <main class="admin-content" id="content"></main>
    </div>
  </div>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
